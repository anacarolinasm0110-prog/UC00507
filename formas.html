<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas</title>
    <style>
        body{
            display: flex;
            height: 100vh;
        }
        div{
            width: 100px; 
            height: 100px;
            background-color: blueviolet;
        }
        .verde{
            background-color: green;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .azul{
            background-color: blue;
            position: absolute;
            left: 50vh;
        }
        .roxo{
            background-color: purple;
            position: absolute;
            right: 0px;
            bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="verde">1</div>
    <div class="azul">2</div>
    <div class="roxo">3</div>
</body>
</html>
