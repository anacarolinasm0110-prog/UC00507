<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formas</title>
    <style>
        body{
            display: flex;
            height: 100vh;
        }
        div{
            width: 100px; 
            height: 100px;
            border-radius: 50%;
        }
        .verde{
            background-color: green;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        .azul{
            background-color: blue;
            position: absolute;
            left: 95vh;
            bottom: 45vh;
        }
        .roxo{
            background-color: purple;
            position: absolute;
            right: 0px;
            bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="verde"></div>
    <div class="azul"></div>
    <div class="roxo"></div>
</body>
</html>
